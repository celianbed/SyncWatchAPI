# Blueprint Render — https://render.com/docs/blueprint-spec
# Le service web FastAPI ; la base est chez Neon (DATABASE_URL à renseigner).
services:
  - type: web
    name: syncwatch-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # les migrations tournent au démarrage : idempotent, et le plan gratuit
    # n'a pas de preDeployCommand.
    #
    # --forwarded-allow-ips : sans lui, uvicorn ignore X-Forwarded-For (il ne fait
    # confiance qu'à 127.0.0.1 par défaut) et voit l'adresse du proxy Render pour
    # tout le monde. La limitation de débit, indexée sur l'IP, devient alors un
    # compteur unique partagé par tous les utilisateurs. « * » est sûr ici : le
    # service n'est joignable qu'à travers le proxy, jamais en direct.
    startCommand: >-
      alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false # collée depuis Neon (avec ?sslmode=require), jamais dans le dépôt
      - key: TMDB_API_TOKEN
        sync: false # jeton TMDB v4, jamais dans le dépôt
      - key: SECRET_KEY
        generateValue: true # généré par Render au premier déploiement
      - key: CRON_SECRET
        generateValue: true # à recopier dans cron-job.org (header X-Cron-Secret)
