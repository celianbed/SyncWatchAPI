<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncWatch</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      font-family: -apple-system, Arial, sans-serif;
      color: #F1F5F9;
    }
    .carte {
      background: #1E293B;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 340px;
      width: 86%;
      text-align: center;
    }
    .icone { font-size: 52px; }
    h1 { font-size: 22px; margin: 16px 0 6px; }
    p { color: #94A3B8; font-size: 14px; line-height: 21px; margin: 0; }
  </style>
</head>
<body>
  <div class="carte">
    <div class="icone">$icone</div>
    <h1>$titre</h1>
    <p>$sous_titre</p>
  </div>
</body>
</html>
