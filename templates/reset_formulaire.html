<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncWatch — Nouveau mot de passe</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      font-family: -apple-system, Arial, sans-serif;
      color: #F1F5F9;
    }
    .carte {
      background: #1E293B;
      border-radius: 16px;
      padding: 32px 26px;
      max-width: 360px;
      width: 86%;
    }
    h1 { font-size: 21px; margin: 0 0 6px; text-align: center; }
    p.sous { color: #94A3B8; font-size: 14px; line-height: 20px; margin: 0 0 22px; text-align: center; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      color: #F1F5F9;
      font-size: 15px;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #8B5CF6; }
    button {
      width: 100%;
      background: #8B5CF6;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .err { color: #F87171; font-size: 13px; margin: 0 0 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Nouveau mot de passe</h1>
    <p class="sous">Choisis un nouveau mot de passe (8 caractères minimum).</p>
    $bloc_erreur
    <form method="post" action="/auth/reinitialiser-mot-de-passe"
          onsubmit="if(this.mot_de_passe.value!==this.confirmation.value){alert('Les mots de passe ne correspondent pas.');return false;}">
      <input type="hidden" name="jeton" value="$jeton">
      <input type="password" name="mot_de_passe" placeholder="Nouveau mot de passe"
             minlength="8" required autocomplete="new-password">
      <input type="password" name="confirmation" placeholder="Confirmer le mot de passe"
             minlength="8" required autocomplete="new-password">
      <button type="submit">Réinitialiser</button>
    </form>
  </div>
</body>
</html>
