name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Postgres jetable pour les tests (le conftest crée sa base sync_watch_test dessus)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_watch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sync_watch
      SECRET_KEY: cle-de-test-ci-non-secrete
      # Jeton factice : les tests TMDB passent par un transport simulé (aucun appel
      # réseau) mais vérifient la présence de l'en-tête Authorization: Bearer.
      TMDB_API_TOKEN: jeton-tmdb-de-test-ci
      RATE_LIMIT_ACTIF: "false"
      NOTIFICATIONS_PLANIFIEES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

  # Vulnérabilités connues des dépendances. Volontairement hors du chemin du
  # déploiement (deploy ne dépend que de « tests ») : une CVE publiée un mardi ne
  # doit pas empêcher de livrer un correctif le mercredi, mais elle doit se voir.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # On audite l'environnement installé, et non le seul requirements.txt :
      # les dépendances transitives sont couvertes de la même façon.
      - name: Installer les dépendances
        run: pip install -r requirements.txt pip-audit

      # PYSEC-2026-1325 (ecdsa) est écartée sciemment : le paquet est tiré par
      # python-jose mais son code n'est jamais exécuté ici — jose choisit le
      # backend « cryptography » dès qu'il est installé, ce qui est notre cas.
      # Aucun correctif amont n'existe ; sans cette exception le job resterait
      # rouge en permanence et plus personne ne le lirait.
      - name: Vulnérabilités connues
        run: pip-audit --ignore-vuln PYSEC-2026-1325

  # Déploiement Render — ne part QUE si les tests ci-dessus passent, et
  # uniquement sur un push vers main (jamais sur une Pull Request).
  # Prérequis côté Render : couper l'Auto-Deploy et copier le « Deploy Hook »,
  # puis l'ajouter en secret GitHub RENDER_DEPLOY_HOOK.
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
